# JuliaOS Configuration

[system]
environment = "development"  # development, staging, production
debug = true
log_level = "info"          # debug, info, warn, error
version = "0.1.0"

[api]
host = "0.0.0.0"
port = 8052
log_level = "info"
cors_enabled = true
allowed_origins = ["*"]
rate_limit = 100           # requests per minute
timeout = 30               # seconds

[api.websocket]
enabled = true
port = 8053
heartbeat_interval = 30    # seconds

# Security configuration
[security]
rate_limit = 100  # requests per minute
max_request_size = 1048576  # 1MB
enable_authentication = false
# Add a list of valid API keys. Clients must provide one of these in the X-API-Key header.
# It is strongly recommended to change these default keys and use secure, randomly generated keys.
api_keys = ["default-secret-key-please-change"]

[storage]
type = "local"            # local, ipfs, arweave
path = "data/storage"
max_file_size = 10485760  # 10MB in bytes

# Local storage configuration
local_db_path = "~/.juliaos/juliaos.sqlite"

# IPFS storage configuration
ipfs_api_url = "http://127.0.0.1:5001"
ipfs_gateway_url = "http://127.0.0.1:8080"
ipfs_timeout = 30
ipfs_use_cli = false
ipfs_binary_path = "ipfs"
ipfs_pin_files = true

# Arweave storage configuration
arweave_gateway_url = "https://arweave.net"
arweave_wallet_file = ""
arweave_timeout = 60
arweave_use_bundlr = false
arweave_bundlr_url = "https://node1.bundlr.network"
arweave_currency = "arweave"

[storage.arweave]
host = "arweave.net"
port = 443
protocol = "https"

[storage.web3]
ipfs_gateway = "https://ipfs.io/ipfs/"
pinata_api_key = ""
pinata_secret_key = ""

[database]
type = "sqlite"           # sqlite, postgres
path = "data/juliaos.db"
pool_size = 5
timeout = 30             # seconds

[cache]
type = "memory"          # memory, redis
max_size = 1000         # entries
ttl = 3600             # seconds

[cache.redis]
host = "localhost"
port = 6379
password = ""
db = 0

[queue]
type = "memory"          # memory, redis
max_size = 10000        # entries

[blockchain]
default_chain = "ethereum"
rpc_urls.ethereum = "https://mainnet.infura.io/v3/YOUR_API_KEY"
rpc_urls.polygon = "https://polygon-rpc.com"
rpc_urls.solana = "https://api.mainnet-beta.solana.com"
max_gas_price = 100.0
max_slippage = 0.01
supported_chains = ["ethereum", "polygon", "solana"]
gas_limit = 300000
gas_price_strategy = "medium"  # low, medium, high

[blockchain.networks.ethereum]
rpc_url = "https://mainnet.infura.io/v3/your-project-id"
chain_id = 1
explorer = "https://etherscan.io"

[blockchain.networks.polygon]
rpc_url = "https://polygon-rpc.com"
chain_id = 137
explorer = "https://polygonscan.com"

[agents]
max_agents = 100
default_timeout = 300    # seconds
health_check_interval = 60  # seconds

[swarms]
max_swarms = 10
max_agents_per_swarm = 50
optimization_timeout = 600  # seconds

[bridges]
default_bridge = "wormhole"
timeout = 300            # seconds
confirmations = 12       # blocks

[bridges.wormhole]
contract = "0x98f3c9e6E3fAce36bAAd05FE09d375Ef1464288B"
guardian_rpc = "https://wormhole-v2-mainnet-api.certus.one"

[bridges.axelar]
gateway = "0x4F4495243837681061C4743b74B3eEdf548D56A5"
gas_service = "0x2d5d7d31F671F86C782533cc367F14109a082712"

[monitoring]
enable_metrics = true
metrics_port = 9090
enable_tracing = true
trace_sample_rate = 0.1   # 10% of requests

[development]
hot_reload = true
debug_logging = true
profile_endpoints = false

[swarm]
default_algorithm = "DE"
default_population_size = 50
max_iterations = 1000
parallel_evaluation = true

[bridge]
port = 8052
host = "localhost"
bridge_api_url = "http://localhost:3001/api/v1"

[wormhole]
enabled = true
network = "testnet"

[wormhole.networks.ethereum]
rpcUrl = "https://goerli.infura.io/v3/your-infura-key"
enabled = true

[wormhole.networks.solana]
rpcUrl = "https://api.devnet.solana.com"
enabled = true

[logging]
level = "info"
format = "json"
retention_days = 7 